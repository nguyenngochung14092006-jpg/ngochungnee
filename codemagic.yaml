workflows:
  ios-build:
    name: MessagesUI iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.vanh.MessagesUI
      vars:
        XCODE_PROJECT: "MessagesUI.xcodeproj"
        XCODE_SCHEME: "MessagesUI"
        BUNDLE_ID: "com.vanh.MessagesUI"

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Set bundle identifier
        script: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIdentifier $BUNDLE_ID" \
            "MessagesUI/Info.plist" 2>/dev/null || true

      - name: Build IPA
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/MessagesUI.xcarchive" \
            archive

      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/MessagesUI.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$CM_BUILD_DIR/ipa"

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/MessagesUI.xcarchive

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
